# Godot 版（电脑版）：无画面测试 + 导出 Windows（单个 exe），放到 Releases 的「godot-proto」
# 2026-11：专注电脑版——不再导出网页版和安卓 APK，也不再触发官网更新
name: Godot 版

on:
  push:
    branches: [main, master]
    paths: ['godot/**', 'tools/export-godot-data.js', '.github/workflows/godot.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  GODOT_VER: 4.3-stable

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Godot 和导出模板
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VER }}

      - name: 下载 Godot ${{ env.GODOT_VER }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VER/-/.}
          cd ~/godot
          curl -sSL -o g.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_linux.x86_64.zip"
          unzip -q g.zip && mv Godot_v${GODOT_VER}_linux.x86_64 godot && rm g.zip
          curl -sSL -o t.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_export_templates.tpz"
          unzip -q t.tpz && mv templates/* ~/.local/share/godot/export_templates/${GODOT_VER/-/.}/ && rm -rf t.tpz templates

      - name: 导入资源 + 无画面测试
        run: |
          ~/godot/godot --headless --path godot --import || true
          ~/godot/godot --headless --path godot --script res://tests/sim_test.gd
          ~/godot/godot --headless --path godot --script res://tests/profile_test.gd
          ~/godot/godot --headless --path godot --script res://tests/loot_test.gd
          ~/godot/godot --headless --path godot --script res://tests/dawn_test.gd
          # 账号：和网页版的转移码互通、在线账号（临时开一个 node server.js）
          GB_ACCOUNTS=/tmp/acc.json PORT=3917 node server.js &
          sleep 1
          GB_SERVER=127.0.0.1:3917 ~/godot/godot --headless --path godot --script res://tests/account_test.gd
          GB_SERVER=127.0.0.1:3917 ~/godot/godot --headless --path godot --script res://tests/social_test.gd
          # 线上房间：两个电脑版进程通过服务器转发对战（房主开房 → 客人用房间号加入 → 客人收到画面）
          rm -f /tmp/code.txt
          GB_LAN=host GB_SERVER=127.0.0.1:3917 GB_CODEFILE=/tmp/code.txt GB_NO_MUSIC=1 GB_QUIT_AT=22 timeout 120 ~/godot/godot --headless --path godot > /tmp/on_host.log 2>&1 &
          GB_LAN=join GB_SERVER=127.0.0.1:3917 GB_CODEFILE=/tmp/code.txt GB_NO_MUSIC=1 GB_QUIT_AT=20 timeout 120 ~/godot/godot --headless --path godot > /tmp/on_cli.log 2>&1 || true
          grep -E "线上测试|state=play" /tmp/on_cli.log | tail -3
          grep -qE "state=play players=8 snaps=[1-9]" /tmp/on_cli.log

      - name: 导出
        run: |
          mkdir -p build/godot/windows
          echo "{\"built\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"commit\":\"${GITHUB_SHA::7}\"}" > godot/data/build.json   # 游戏里检查更新用
          ~/godot/godot --headless --path godot --export-release "Windows Desktop" ../build/godot/windows/GraffiBots.exe
          ls -la build/godot/windows

      - name: 打包并更新 Release（godot-proto）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd build/godot/windows && zip -q ../../GraffiBots-Godot-Windows.zip GraffiBots.exe)
          # 正式公告：Release 说明由 godot/data/news.json 生成（和游戏里的更新公告同一份）
          python3 - > build/notes.md <<'PY'
          import json
          N = json.load(open("godot/data/news.json", encoding="utf-8"))[0]
          out = ["# " + N["title"], "", N["intro"], ""]
          for s in N["sections"]:
              out += ["## " + s["h"]] + ["- " + i for i in s["items"]] + [""]
          out += ["**下载**：解压 `GraffiBots-Godot-Windows.zip`，双击 `GraffiBots.exe`。存档在 `%APPDATA%/Godot/app_userdata/涂鸦机兵 GraffiBots`，覆盖安装不会丢。", "", "---", "", "# " + N["title_en"], "", N["intro_en"], ""]
          for s in N["sections"]:
              out += ["## " + s["h_en"]] + ["- " + i for i in s["items_en"]] + [""]
          out += ["**Download**: unzip `GraffiBots-Godot-Windows.zip` and run `GraffiBots.exe`."]
          print("\n".join(out))
          PY
          TITLE=$(python3 -c 'import json;N=json.load(open("godot/data/news.json",encoding="utf-8"))[0];print(N["title"])')
          gh release delete godot-proto --yes --cleanup-tag || true
          gh release create godot-proto build/GraffiBots-Godot-Windows.zip \
            --title "$TITLE" --notes-file build/notes.md --latest --target ${{ github.sha }}
