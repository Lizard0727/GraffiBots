/* 版式：夜里的一面灰色水泥墙正在被喷回彩色。首屏就是这面墙，下面的内容像胶带、模板字和海报贴在墙上。
   只做一套深色外观（墙就是黑夜里的），所以所有颜色都在 :root 里写死。 */
:root {
  --wall: #1c1b21; --wall-2: #24232a; --wall-3: #2f2e36; --seam: #3b3943;
  --chalk: #f2eee6; --dust: #a6a2ad; --grey: #7f7c86;
  --ny: #ffe600; --np: #ff3ea5; --nc: #1fd6ee; --ng: #9cff2e;
  --ink: #141018; --paper: #fff6e3; --tape: #f4e7a8cc;
  --f-head: 'GBHead', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  --f-num: 'GBNum', 'Impact', 'Arial Black', sans-serif;
  --f-tag: 'GBTag', 'Comic Sans MS', 'Segoe Print', cursive;
  --f-body: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body { margin: 0; background: var(--wall); color: var(--chalk); font: 15px/1.65 var(--f-body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; }
img, svg { max-width: 100%; }
:focus-visible { outline: 3px solid var(--nc); outline-offset: 3px; border-radius: 4px; }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
h1, h2, h3 { text-wrap: balance; margin: 0; font-weight: 400; }
.en-mode .zh-only, .zh-mode .en-only { display: none !important; }

/* ---------- 顶栏 ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--wall); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--wall) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--seam); }
.top .wrap { display: flex; align-items: center; gap: 18px; height: 58px; }
.brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; margin-right: auto; white-space: nowrap; }
.brand b { font: 24px/1 var(--f-head); color: var(--ny); text-shadow: 2px 2px 0 var(--ink), 4px 4px 0 var(--np); transform: rotate(-2deg); display: inline-block; }
.brand span { font: 15px/1 var(--f-num); letter-spacing: 2px; color: var(--dust); }
.nav { display: flex; align-items: center; gap: 4px; }
.nav a, .lang button { text-decoration: none; padding: 7px 11px; border-radius: 8px; color: var(--dust); font-weight: 700; font-size: 14px; white-space: nowrap; }
.nav a:hover { color: var(--chalk); background: var(--wall-3); }
.nav a[aria-current="page"] { color: var(--ink); background: var(--ny); }

.lang button[aria-pressed="true"] { background: var(--chalk); color: var(--ink); }
@media (max-width: 620px) { .logo .lat { transform: rotate(-3deg); margin-top: 14px; } }
@media (max-width: 620px) { .brand span, .nav .wide { display: none; } .top .wrap { gap: 8px; } .nav a { padding: 7px 8px; } }

/* ---------- 按钮 ---------- */
.btn { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font: 22px/1 var(--f-head); letter-spacing: 2px; padding: 15px 26px 13px; border: 3px solid var(--ink); border-radius: 12px 16px 11px 15px; cursor: pointer; transition: transform .1s, box-shadow .1s; }
.btn-play { background: var(--ny); color: var(--ink); box-shadow: 4px 5px 0 var(--ink), 7px 8px 0 var(--np); transform: rotate(-1.5deg); }

/* ---------- 首屏：墙 ---------- */
.hero { position: relative; overflow: hidden; border-bottom: 3px solid var(--ink); }
#wall { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #1c1b21f0 0%, #1c1b21b8 38%, #1c1b2100 66%); pointer-events: none; }

.logo .lat { font: clamp(28px, 4.4vw, 50px)/1 var(--f-num); letter-spacing: 5px; color: var(--chalk); text-shadow: 3px 3px 0 var(--ink); transform: rotate(-3deg) translateY(-6px); display: inline-block; }

.poster { position: relative; display: block; width: 250px; text-decoration: none; background: var(--paper); color: var(--ink); padding: 26px 22px 20px; transform: rotate(4deg); box-shadow: 6px 8px 0 #0008; border-radius: 3px; transition: transform .15s; }

.poster time { display: block; font-size: 13px; color: #5c5560; margin: 6px 0 14px; font-variant-numeric: tabular-nums; }

  .hero::after { background: linear-gradient(180deg, #1c1b21c8 0%, #1c1b21e0 60%, #1c1b21b0 100%); }
  .poster { justify-self: start; transform: rotate(2deg); width: min(100%, 300px); }
}

/* ---------- 通用段落 ---------- */
.band { padding-block: 72px; border-bottom: 1px solid var(--seam); }
.band.alt { background: var(--wall-2); }
.sec-h { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 22px; margin-bottom: 34px; }

/* 最新更新：截图 */
.shots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 26px; margin-bottom: 44px; }

/* 3D 展示台 */
.stage-wrap { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 28px; align-items: center; margin-bottom: 30px; }

      poster_tag: 'Latest version', poster_go: 'See what changed →', updated: (d) => `Updated ${d}`,
      all_notes: 'Full patch notes →', more_items: (n) => `${n} more →`,
      roster_h: 'Pilots & mechs', roster_p: 'Pick a pilot and a mech separately: every pilot has their own skill, passive, overload and 3D model, and can drive any mech. When a mech is destroyed the pilot ejects and keeps fighting with their own sidearm.',
      season: 'SEASON', quest: 'QUEST', strike: 'STRIKE', side: 'Sidearm', skill: 'Skill', passive: 'Passive', ov: 'Overload', fav: 'Favorite mech',
      act_hello: 'Hello', act_attack: 'Attack', act_victory: 'Celebrate', act_show: 'Full routine', drag: 'Drag to rotate', loading3d: 'Loading 3D model…', no3d: '3D isn\'t supported in this browser, showing a render', th_mech: 'Mech', th_role: 'Role', th_hp: 'HP', th_range: 'Range',
      modes_h: 'Modes', modes_p: 'Every mode has 4v4 quick matches, or open a room and play with friends.', maps_h: 'Maps',
      dl_h: 'Download & play', dl_lede: (v, d) => `Current version ${v}, released ${d}. Every update is posted here first.`,
      dl: {
        web: ['Browser', 'Play now', 'Runs in your browser with nothing to install. Sign in to an online account and your progress is saved on the server.'],
        offline: ['Offline file', 'HTML file', 'One file: double-click to play, or send it to a friend. Fight AI offline, or link up on a local network with a room code.'],
        win: ['Windows', 'ZIP · double-click the .bat', 'Unzip and double-click the launcher .bat file: the game opens in its own Edge / Chrome app window with GPU acceleration and no toolbar or extensions slowing it down — smoother than a browser tab.'],
        full: ['Full package', 'ZIP · needs Node.js', 'Includes the server: host on your own PC for LAN play and online accounts. Unzip and run “node server.js”.'],
        apk: ['Android app', 'APK', 'Install on an Android phone for full-screen landscape play with twin-stick touch controls.'],
      },
      dl_go: 'Download', web_go: 'Play now', not_yet: 'Not available yet', site_go: 'Get it on the website',
      how_h: 'How to update', how: ['Open the game. When “New version” appears at the top of the lobby, tap “Get it”.', 'Check what changed on this page, then download the new version.', 'Replace the old file with the new one (on Android, just install over it).'],
      how_note: 'Online account progress lives on the server, so switching versions never loses it.',
      upd_h: 'Patch notes', upd_p: 'Every GraffiBots update is posted here first: new pilots, new maps, balance changes and update rewards.',
      latest: 'LATEST', foot_ver: (v) => `Version ${v}`, foot_fonts: 'Fonts: ZCOOL QingKe HuangYou, Bangers, Permanent Marker (open-source)',
    },
  };
  let lang = /^zh/i.test(navigator.language || '') ? 'zh' : 'en';
  try { const v = localStorage.getItem('gbsite_lang'); if (v === 'zh' || v === 'en') lang = v; } catch (e) { /* 没存过 */ }
  const t = (k) => T[lang][k];
  const L = (o, k) => (lang === 'en' ? o['en_' + k] || o[k] : o[k]);
  const nm = (o) => (lang === 'en' ? o.en : o.name);
  const mb = (n) => (n / 1048576).toFixed(1) + ' MB';
  const vid = (v) => 'v' + String(v).replace(/\./g, '-');
  const notesOf = (n) => (lang === 'en' ? n.en : n.sections);
  const titleOf = (n) => { const s = lang === 'en' ? n.en_title : n.title; const i = s.indexOf(' · '); return i >= 0 ? s.slice(i + 3) : s; };
  // 「5.8 → 5.4」：旧数值划掉，新数值高亮；「｜」换成分隔线
  const fmt = (s) => esc(s).replace(/([+\-−]?\d[\d.,]*%?) → ([+\-−]?\d[\d.,]*%?)/g, '<del class="old">$1</del> → <b class="new">$2</b>').replace(/\s*[｜|]\s*/g, '<span class="sep" aria-hidden="true"></span>');

  const onServer = /^\/site(\/|$)/.test(location.pathname);
  const offline = D.downloads.find((d) => d.id === 'offline');
  const playUrl = CFG.play || (onServer ? '/' : offline && offline.have ? offline.file : '../public/index.html');
  let sel = (D.pilots.find((p) => p.id === 'blaze') || D.pilots[0]).id;
  const R3 = { api: null, state: 'idle' };   // 3D 展示台：idle → loading → live / failed

  function render() {
    document.body.className = lang + '-mode';
    document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
    $('langZh').setAttribute('aria-pressed', lang === 'zh'); $('langEn').setAttribute('aria-pressed', lang === 'en');
    for (const el of document.querySelectorAll('[data-t]')) { const v = t(el.dataset.t); if (typeof v === 'string') el.textContent = v; }
    $('kicker').innerHTML = t('kicker');
    $('playBtn').href = playUrl;
    $('dlBtn').textContent = t('dl_btn')(D.version);
    const c = D.counts;
    $('facts').innerHTML = [c.pilots, c.mechs, c.maps, c.modes].map((n, i) => `<li><b>${n}</b>${t('facts')[i]}</li>`).join('');
    $('poster').innerHTML = `<span class="tag">${esc(t('poster_tag'))}</span><span class="v">${esc(D.version)}</span><h2>${esc(titleOf(D.notes[0]))}</h2><time datetime="${D.date}">${esc(t('updated')(D.date))}</time><span class="go">${esc(t('poster_go'))}</span>`;
    $('poster').href = '#' + vid(D.version);
    // 最新更新
    const N = D.notes[0], secs = notesOf(N);
    $('latestTitle').textContent = (lang === 'en' ? N.en_title : N.title);
    $('latestLede').textContent = secs.map((s) => s[0]).join(lang === 'en' ? ' · ' : ' · ');
    $('shots').innerHTML = D.shots.map((s) => `<figure class="shot"><img src="${esc(s.img)}" alt="${esc(L(s, 'cap'))}" loading="lazy" width="1280" height="720"><figcaption><b>${esc(L(s, 'cap'))}</b><span>${esc(L(s, 'sub'))}</span></figcaption></figure>`).join('');
    const rest = secs.slice(1), lens = rest.map((x) => x[1].length), big = rest.length % 2 ? lens.indexOf(Math.max(...lens)) : -1;
    $('hl').innerHTML = rest.map(([h, items], i) => {
      const show = items.slice(0, 3);
      return `<section class="${i === big ? 'big' : ''}"><h3>${esc(h)}</h3><ul>${show.map((x) => `<li>${fmt(x)}</li>`).join('')}</ul>${items.length > 3 ? `<a class="more" href="#${vid(N.v)}">${esc(t('more_items')(items.length - 3))}</a>` : ''}</section>`;
    }).join('');
    // 驾驶员 / 机兵
    $('roster').innerHTML = D.pilots.map((p) => `<button type="button" class="pc" data-id="${esc(p.id)}" aria-pressed="${p.id === sel}" style="--acc:${esc(p.accent)}"><div class="art">${p.img ? `<img src="${esc(p.img)}" alt="${esc(nm(p))}" loading="lazy" width="360" height="440">` : p.svg}</div>${p.tag ? `<span class="sticker ${p.tag}">${esc(t(p.tag))}</span>` : ''}<div class="meta"><b>${esc(nm(p))}</b><span>${esc(L(p, 'title'))}</span><em>${esc(t('side'))} · ${esc(L(p, 'side'))}</em></div></button>`).join('');
    for (const btn of $('roster').querySelectorAll('.pc')) btn.addEventListener('click', () => { sel = btn.dataset.id; for (const o of $('roster').querySelectorAll('.pc')) o.setAttribute('aria-pressed', o === btn); renderStage(true); });
    renderStage(false);
    const maxHp = Math.max(...D.mechs.map((m) => m.hp)), maxR = Math.max(...D.mechs.map((m) => m.range));
    $('mechRows').innerHTML = D.mechs.map((m) => `<tr><td>${esc(nm(m))}${m.tag ? `<span class="sticker ${m.tag}">${esc(t(m.tag))}</span>` : ''}</td><td>${esc(L(m, 'role'))}</td><td class="num">${m.hp}<i class="bar" style="width:${Math.round(m.hp / maxHp * 60)}px"></i></td><td class="num">${m.range || '—'}${m.range ? `<i class="bar r" style="width:${Math.round(m.range / maxR * 60)}px"></i>` : ''}</td></tr>`).join('');
    // 玩法 / 地图
    const MC = ['var(--ny)', 'var(--nc)', 'var(--np)', 'var(--ng)'];
    $('modes').innerHTML = D.modes.map((m, i) => `<article class="mode" style="--mc:${MC[i % 4]}"><h3>${esc(nm(m))}</h3>${m.isNew ? '<span class="sticker">NEW</span>' : ''}<p>${esc(L(m, 'desc'))}</p></article>`).join('');
    $('maps').innerHTML = D.maps.map((m) => `<li class="${m.isNew ? 'new' : ''}">${esc(nm(m))}${m.isNew ? `<span class="sticker">NEW ${esc(D.version)}</span>` : ''}</li>`).join('');
    // 下载
    $('dlLede').textContent = t('dl_lede')(D.version, D.date);
    const dl = t('dl');
    const card = (id, main, btn) => `<article class="dc${main ? ' main' : ''}"><span class="what">${esc(dl[id][1])}</span><h3>${esc(dl[id][0])}</h3><p>${esc(dl[id][2])}</p>${btn}</article>`;
    let html = card('web', true, `<span class="size">v${esc(D.version)}</span><a class="btn btn-play btn-sm" href="${esc(playUrl)}" target="_blank" rel="noopener">${esc(t('web_go'))}</a>`);
    for (const d of D.downloads) {
      let btn;
      if (d.have) btn = `<span class="size">${mb(d.size)}</span><a class="btn btn-ghost btn-sm" href="${esc(d.file)}" download>${esc(t('dl_go'))}</a>`;
      else if (CFG.home) btn = `<span class="size">v${esc(D.version)}${d.size ? ' · ' + mb(d.size) : ''}</span><a class="btn btn-ghost btn-sm" href="${esc(CFG.home)}#download" target="_blank" rel="noopener">${esc(t('site_go'))}</a>`;
      else btn = `<span class="size">v${esc(D.version)}</span><a class="btn btn-sm" aria-disabled="true">${esc(t('not_yet'))}</a>`;
      html += card(d.id, false, btn);
    }
    $('dl').innerHTML = html;
    $('howSteps').innerHTML = t('how').map((s) => `<li>${esc(s)}</li>`).join('');
    // 更新日志
    $('updIndex').innerHTML = D.notes.map((n) => `<a href="#${vid(n.v)}" data-v="${vid(n.v)}"><span class="vn">${esc(n.v)}</span><span class="tt">${esc(titleOf(n))}</span><time datetime="${n.date}">${n.date}</time></a>`).join('');
    $('notes').innerHTML = D.notes.map((n, i) => `<article class="note" id="${vid(n.v)}"><div class="note-head"><span class="vnum">${esc(n.v)}</span><div><h2>${esc(titleOf(n))}</h2><time datetime="${n.date}">${n.date}</time></div>${i === 0 ? `<span class="sticker">${esc(t('latest'))}</span>` : ''}</div><div class="note-body">${notesOf(n).map(([h, items]) => `<section><h3>${esc(h)}</h3><ul>${items.map((x) => `<li>${fmt(x)}</li>`).join('')}</ul></section>`).join('')}</div></article>`).join('');
    $('footVer').textContent = t('foot_ver')(D.version);
    document.title = lang === 'en' ? 'GraffiBots | 4v4 Paint-Mech Brawler' : '涂鸦机兵 GraffiBots｜4v4 涂料机甲对战游戏';
    route(false);
  }

  // ---------- 3D 驾驶员展示台（用游戏自己的渲染代码，选中时播放展示动作） ----------
  function renderStage(picked) {
    const p = D.pilots.find((x) => x.id === sel);
    if (!p) return;
    $('stageWrap').style.setProperty('--acc', p.accent);
    $('stageImg').src = p.img || ''; $('stageImg').alt = nm(p);
    const ab = (k, name, desc, cls) => `<div class="abil ${cls || ''}"><span class="k">${esc(t(k))}</span><b>${esc(name)}</b><p>${esc(desc)}</p></div>`;
    $('stageInfo').innerHTML = `<span class="code">「${esc(L(p, 'code'))}」</span><h3>${esc(nm(p))}</h3><div class="ttl">${esc(L(p, 'title'))} · ${esc(t('fav'))}：${esc(L(p, 'mech'))}</div>
      <blockquote>“${esc(L(p, 'line'))}”</blockquote>
      <div class="abils">${ab('side', L(p, 'side'), L(p, 'side_desc'), 'side')}${ab('skill', L(p, 'skill'), L(p, 'skill_desc'))}${ab('passive', L(p, 'passive'), L(p, 'passive_desc'))}${ab('ov', L(p, 'ov'), L(p, 'ov_desc'))}</div>
      <div class="acts">${['show', 'hello', 'attack', 'victory'].map((a) => `<button type="button" data-act="${a}" ${R3.state === 'live' ? '' : 'disabled'}>${esc(t('act_' + a))}</button>`).join('')}</div>`;
    for (const b of $('stageInfo').querySelectorAll('[data-act]')) b.addEventListener('click', () => { if (R3.api) R3.api.charAction(b.dataset.act); });
    $('stageHint').textContent = R3.state === 'live' ? t('drag') : R3.state === 'failed' ? t('no3d') : R3.state === 'loading' ? t('loading3d') : '';
    if (R3.api) R3.api.charPreview($('stage'), p.id, p.accent);
    if (picked && window.innerWidth < 820) $('stageWrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function loadScript(srcs) {
    return new Promise((res, rej) => {
      const next = (i) => {
        if (i >= srcs.length) return rej(new Error('load failed'));
        const el = document.createElement('script'); el.src = srcs[i];
        el.onload = () => res(); el.onerror = () => { el.remove(); next(i + 1); };
        document.head.appendChild(el);
      };
      next(0);
    });
  }
  function webgl() { try { const c = document.createElement('canvas'); return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl'))); } catch (e) { return false; } }
  async function load3D() {
    if (R3.state !== 'idle') return;
    if (!webgl()) { R3.state = 'failed'; renderStage(false); return; }
    R3.state = 'loading'; renderStage(false);
    try {
      // 部署的官网：game/ 文件夹；node server.js：/site/game/ 映射到游戏；直接打开仓库里的 site/index.html：../public/
      if (!window.THREE) await loadScript(['game/vendor/three.min.js', '../public/vendor/three.min.js']);
      if (!window.GS) await loadScript(['game/shared.js', '../public/shared.js']);
      if (!window.GB3D) await loadScript(['game/render3d.js', '../public/render3d.js']);
      R3.api = window.GB3D;
      const p0 = D.pilots.find((x) => x.id === sel);
      if (!R3.api || !R3.api.charPreview($('stage'), sel, p0.accent)) throw new Error('no renderer');
      R3.state = 'live'; $('stage').classList.add('live');
      renderStage(false);
      let last = performance.now();
      const tick = (now) => { R3.api.charFrame(now, Math.min(0.05, (now - last) / 1000)); last = now; requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
    } catch (e) { R3.state = 'failed'; renderStage(false); }
  }
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) { io.disconnect(); load3D(); } }, { rootMargin: '300px' });
    io.observe($('stageWrap'));
  } else load3D();

  // ---------- 路由：#home / #updates / #v1-2 / #download ... ----------
  function route(scroll = true) {
    const h = location.hash.slice(1);
    const upd = h === 'updates' || /^v\d/.test(h);
    $('home').hidden = upd; $('updates').hidden = !upd;
    for (const a of document.querySelectorAll('.nav a[data-route]')) { if ((a.dataset.route === 'updates') === upd) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); }
    for (const a of document.querySelectorAll('.upd-index a')) a.classList.toggle('on', a.dataset.v === h || (h === 'updates' && a === document.querySelector('.upd-index a')));
    if (!scroll) return;
    const el = h && h !== 'home' && h !== 'updates' ? document.getElementById(h) : null;
    if (el) requestAnimationFrame(() => el.scrollIntoView({ block: 'start' }));
    else window.scrollTo(0, 0);
    if (!upd) paintWall();
  }
  window.addEventListener('hashchange', () => route(true));
  for (const b of document.querySelectorAll('.lang button')) b.addEventListener('click', () => {
    lang = b.dataset.lang;
    try { localStorage.setItem('gbsite_lang', lang); } catch (e) { /* 不能存就算了 */ }
    render();
  });

  // ---------- 首屏的墙：灰色水泥墙，上面被喷上三种颜色 ----------
  const cv = $('wall');
  let rnd;
  const seed = (s) => { rnd = () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let x = Math.imul(s ^ (s >>> 15), 1 | s); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; };
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let anim = 0, lastW = 0;
  function concrete(g, w, h) {
    g.fillStyle = '#2a2930'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < w * h / 90; i++) { const v = rnd(); g.fillStyle = v < 0.5 ? `rgba(0,0,0,${0.08 + rnd() * 0.12})` : `rgba(255,255,255,${0.02 + rnd() * 0.04})`; const s = 1 + rnd() * 2.4; g.fillRect(rnd() * w, rnd() * h, s, s); }
    // 浇筑缝和对拉螺栓孔
    const pw = 300, ph = Math.max(180, h / 2);
    g.strokeStyle = 'rgba(0,0,0,.45)'; g.lineWidth = 2;
    for (let x = pw; x < w; x += pw) { g.beginPath(); g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, h); g.stroke(); }
    for (let y = ph; y < h; y += ph) { g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(w, y + 0.5); g.stroke(); }
    for (let x = pw / 4; x < w; x += pw / 2) for (let y = ph / 4; y < h; y += ph / 2) { g.fillStyle = 'rgba(0,0,0,.5)'; g.beginPath(); g.arc(x, y, 4, 0, 7); g.fill(); g.fillStyle = 'rgba(255,255,255,.06)'; g.beginPath(); g.arc(x - 1, y - 1, 2, 0, 7); g.fill(); }
    // 灰石集团刷上的灰漆（盖住了旧涂鸦）
    g.fillStyle = 'rgba(140,138,146,.18)';
    for (let i = 0; i < 5; i++) { const x = rnd() * w, y = rnd() * h, ww = 220 + rnd() * 380; g.save(); g.translate(x, y); g.rotate((rnd() - 0.5) * 0.1); g.fillRect(-ww / 2, -40, ww, 80 + rnd() * 50); g.restore(); }
  }
  function splat(g, x, y, r, col, k) {
    g.fillStyle = col;
    g.beginPath(); g.arc(x, y, r * k, 0, 7); g.fill();
    const n = 9;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * 6.28 + rnd() * 0.5, d = r * (0.7 + rnd() * 0.7) * k, s = r * (0.18 + rnd() * 0.3) * k;
      g.beginPath(); g.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, s, 0, 7); g.fill();
      if (rnd() < 0.5) { const d2 = d + r * (0.4 + rnd() * 0.8) * k; g.beginPath(); g.arc(x + Math.cos(a) * d2, y + Math.sin(a) * d2, s * 0.35, 0, 7); g.fill(); }
    }
    for (let i = 0; i < 3; i++) { if (rnd() < 0.35) continue; const dx = x + (rnd() - 0.5) * r * 1.3, len = r * (0.8 + rnd() * 1.8) * k, wd = 4 + rnd() * 7; g.fillRect(dx - wd / 2, y, wd, len); g.beginPath(); g.arc(dx, y + len, wd * 0.7, 0, 7); g.fill(); }
  }
  function paintWall() {
    if (!cv || $('home').hidden) return;
    const box = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(1, Math.round(box.width)), h = Math.max(1, Math.round(box.height));
    cv.width = w * dpr; cv.height = h * dpr;
    const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    seed(1214); concrete(g, w, h);
    const base = g.getImageData(0, 0, cv.width, cv.height);
    // 颜料团：靠右上和右下，避开左边的文字
    seed(77);
    const cols = ['#ffe600', '#ff3ea5', '#1fd6ee', '#ff3ea5', '#ffe600', '#1fd6ee', '#9cff2e'];
    const narrow = w < 820, list = [];
    for (let i = 0; i < 11; i++) {
      const x = narrow ? rnd() * w : w * (0.55 + rnd() * 0.47), y = h * (0.05 + rnd() * 0.9);
      list.push({ x, y, r: (narrow ? 26 : 34) + rnd() * (narrow ? 40 : 70), c: cols[i % cols.length], s: rnd() });
    }
    cancelAnimationFrame(anim);
    const t0 = performance.now(), dur = reduce ? 0 : 1400;
    const frame = (now) => {
      g.putImageData(base, 0, 0); g.setTransform(dpr, 0, 0, dpr, 0, 0);
      const p = dur ? Math.min(1, (now - t0) / dur) : 1;
      seed(99);
      list.forEach((sp, i) => { const local = Math.max(0, Math.min(1, (p * list.length - i) / 1.6)); if (local <= 0) { for (let j = 0; j < 40; j++) rnd(); return; } const e = 1 - Math.pow(1 - local, 3); g.globalAlpha = 0.92; splat(g, sp.x, sp.y, sp.r, sp.c, e); });
      g.globalAlpha = 1;
      if (p < 1) anim = requestAnimationFrame(frame);
    };
    anim = requestAnimationFrame(frame);
    lastW = w;
  }
  window.addEventListener('resize', () => { if (cv && Math.abs(cv.getBoundingClientRect().width - lastW) > 40) paintWall(); });

  render();
  route(true);
})();
</script>
